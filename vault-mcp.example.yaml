# vault-mcp policy (SPEC §6.5). scripts/setup copies this file to vault-mcp.yaml,
# which is yours to edit; vault-mcp and vault-watcher read it at startup (restart to apply).
write:
  # Agents write here, plus any page with `maintainer: agent` or `maintainer: shared`.
  allow: [wiki/, raw/, _system/, domains/, shared/]
  # `maintainer: human` pages: edit_with_notice lets agents update them (with a summary and a
  # review-queue notice); read_only refuses, so agents must use review_queue_add (v0.1 behaviour).
  human_pages: edit_with_notice
  # Never writable by agents: the rules they follow. Files, or folders ending in '/'.
  protected: [AGENTS.md, CLAUDE.md, skills/, _system/templates/, _system/graph/ontology.yaml]
  human_edit_grace_s: 90           # refuse agent writes this many seconds after a web-editor save
  delete: false                    # no delete tool exists in v1
  max_file_mb: 10
read:
  deny: [private/, hr/]            # never served over MCP, never indexed for MCP search
rate_limits:                       # per credential
  requests_per_minute: 120
  writes_per_minute: 30
  writes_per_day: 2000
secrets:
  reject_on_write: true            # API keys, tokens, private keys, connection strings
