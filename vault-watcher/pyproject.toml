[project]
name = "vault-watcher"
version = "0.0.0"
description = "Watches the vault: version history, search index, secret scan."
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "vault-core",
    "watchdog>=6,<7",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
